<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; text-align: left;">
            <h1 style="margin: 0;">Poker Tracker</h1>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </header>

        <main>
            <!-- Setup Screen -->
            <section id="setup-screen" class="screen">
                <h2>Game Setup</h2>
                <div class="form-group">
                    <label for="chips-per-buyin">Chips per Buy-in:</label>
                    <input type="number" id="chips-per-buyin" min="1" placeholder="e.g., 100">
                </div>
                <div class="form-group">
                    <label for="dollars-per-buyin">Dollars per Buy-in:</label>
                    <input type="number" id="dollars-per-buyin" min="1" step="0.01" placeholder="e.g., 10">
                </div>
                <button id="start-game-btn" class="primary-btn">Start Game</button>
            </section>

            <!-- Dashboard Screen -->
            <section id="dashboard-screen" class="screen hidden">
                <h2>Active Game</h2>
                <div class="game-info">
                    <p>Buy-in: <span id="info-chips"></span> chips = $<span id="info-dollars"></span></p>
                    <p style="margin-top: 5px; font-size: 1.1rem;">Total Pot: $<span id="info-total-pot" style="font-weight: bold; color: var(--success-color);">0.00</span></p>
                </div>
                
                <div class="add-player-section">
                    <input type="text" id="new-player-name" placeholder="Player Name">
                    <button id="add-player-btn">Add Player</button>
                </div>

                <div class="players-list" id="active-players-list">
                    <!-- Player items will be injected here -->
                </div>

                <div class="actions">
                    <button id="end-game-btn" class="danger-btn">End Game / Cash Out</button>
                </div>
            </section>

            <!-- Cash Out Screen -->
            <section id="cash-out-screen" class="screen hidden">
                <h2>Cash Out</h2>
                <p>Enter the final chip count for each player.</p>
                
                <div class="game-info">
                    <p>Remaining Chips to Account For: <span id="remaining-chips-count" style="font-weight: bold; font-size: 1.2rem;">0</span></p>
                </div>

                <div class="players-list" id="cash-out-players-list">
                    <!-- Cash out inputs will be injected here -->
                </div>

                <div class="actions">
                    <button id="calculate-results-btn" class="primary-btn" disabled>Calculate Results</button>
                    <button id="back-to-dashboard-btn" class="secondary-btn">Back to Game</button>
                </div>
            </section>

            <!-- Results Screen -->
            <section id="results-screen" class="screen hidden">
                <h2>Results</h2>
                
                <div class="results-list" id="final-results-list">
                    <!-- Results will be injected here -->
                </div>

                <div class="actions">
                    <button id="simplify-debts-btn" class="secondary-btn" style="margin-bottom: 10px;">Simplify Calculations</button>
                    <button id="copy-summary-btn" class="secondary-btn" style="margin-bottom: 10px; background-color: #17a2b8;">Copy Summary</button>
                    <button id="new-game-btn" class="primary-btn">Start New Game</button>
                </div>
                
                <div id="simplified-debts-section" class="hidden" style="margin-top: 20px; background: #e9ecef; padding: 15px; border-radius: 4px;">
                    <h3 style="margin-bottom: 10px;">Who Owes Who</h3>
                    <ul id="debts-list" style="list-style-type: none; padding: 0;">
                        <!-- Debts will be injected here -->
                    </ul>
                </div>
            </section>
        </main>
    </div>
    
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
